name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      fastembed:
        description: Run gated FastEmbed retrieval tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings
  # Incremental artifacts are never reused across runners; locally they are 13 GB
  # of `target/debug/incremental`. Caching them is pure cost.
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      # `actions/cache` over `target/` ratcheted: `restore-keys` pulled a stale
      # tree forward, cargo never pruned it, and the job saved the union — 20.4 GB
      # of entries against a 10 GB repo limit, so restore+save was 72% of the run.
      # rust-cache prunes to dependency artifacts and derives its own key from the
      # rustc version, host triple and Cargo.lock, so there is no ratchet.
      # save-if: PRs restore main's cache read-only and skip the save step entirely.
      - name: Cache Cargo data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --workspace --locked

      # E1.7.T2: the checksum-pinned Validation Runtime harness proves the
      # packaged adoc binary produces the committed golden receipt
      # byte-for-byte (parity with the direct library path) on every push,
      # and that the pin gate fails closed — a tampered pin must refuse to
      # invoke. Scope: the pin recorded here is over the binary this job
      # just built (self-attesting), so this step proves the MECHANISM —
      # verify-before-invoke and byte-identical receipts — not that the
      # binary matches externally recorded provenance; release-time
      # pinning owns that (see the ponytail note in run.sh).
      - name: Validation runtime harness parity
        run: |
          scripts/validation-runtime/run.sh pin
          scripts/validation-runtime/run.sh run
          printf '%064d\n' 0 > scripts/validation-runtime/adoc.sha256
          if scripts/validation-runtime/run.sh run; then
            echo "tampered pin was accepted — pin gate is broken" >&2
            exit 1
          fi

      - name: Build documentation
        run: cargo doc --workspace --no-deps --locked

  fastembed-retrieval:
    name: FastEmbed Retrieval
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.fastembed }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      # No cache: this lane is workflow_dispatch-only, so any entry it saved would
      # be LRU-evicted long before the next run while still consuming the budget.

      - name: Run retrieval pilot with FastEmbed
        run: cargo test -p adoc-cli --test retrieval_pilot --features fastembed-it --locked
