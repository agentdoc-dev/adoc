name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      fastembed:
        description: Run gated FastEmbed retrieval tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Cache Cargo data
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --workspace --locked

      # E1.7.T2: the checksum-pinned Validation Runtime harness proves the
      # packaged adoc binary produces the committed golden receipt
      # byte-for-byte (parity with the direct library path) on every push,
      # and that the pin gate fails closed — a tampered pin must refuse to
      # invoke. Scope: the pin recorded here is over the binary this job
      # just built (self-attesting), so this step proves the MECHANISM —
      # verify-before-invoke and byte-identical receipts — not that the
      # binary matches externally recorded provenance; release-time
      # pinning owns that (see the ponytail note in run.sh).
      - name: Validation runtime harness parity
        run: |
          scripts/validation-runtime/run.sh pin
          scripts/validation-runtime/run.sh run
          printf '%064d\n' 0 > scripts/validation-runtime/adoc.sha256
          if scripts/validation-runtime/run.sh run; then
            echo "tampered pin was accepted — pin gate is broken" >&2
            exit 1
          fi

      - name: Build documentation
        run: cargo doc --workspace --no-deps --locked

  fastembed-retrieval:
    name: FastEmbed Retrieval
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.fastembed }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Cache Cargo data
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-fastembed-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fastembed-
            ${{ runner.os }}-cargo-

      - name: Run retrieval pilot with FastEmbed
        run: cargo test -p adoc-cli --test retrieval_pilot --features fastembed-it --locked
