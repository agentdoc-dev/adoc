name: Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/smoke-test.py
      - scripts/qualification/build-intel-runtime.sh
      - examples/quickstart/**
  push:
    tags:
      - "v*"

# Read-only at the workflow level. Only `publish` gets write, and only the
# scopes it needs — previously `contents: write` also applied to the build
# matrix, which compiles third-party code.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            timeout_minutes: 60
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            timeout_minutes: 60
          - runner: macos-15
            target: aarch64-apple-darwin
            timeout_minutes: 60
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            timeout_minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: release-${{ matrix.target }}
          # Never save. GitHub scopes caches by the ref that wrote them, and
          # tags are not parents of anything, so an entry written under
          # refs/tags/v1.2.3 is unreachable from v1.2.4 — it could only ever
          # serve a re-run of its own tag while holding two release-profile
          # trees against the repo's 10 GB budget and LRU-evicting the `test`
          # and `check` entries that every PR depends on. Seeding these keys
          # from main instead would mean a release-profile build on every main
          # push to warm a cache for a rare tag build; not worth it. The
          # restore is therefore always a miss and this action is here for the
          # toolchain install.
          save: false

      - name: Verify native host and candidate
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_TARGET"
          uname -sm
          git rev-parse HEAD

      - name: Build Intel ONNX Runtime from pinned source
        if: matrix.target == 'x86_64-apple-darwin'
        run: scripts/qualification/build-intel-runtime.sh target/release

      - name: Build CLI and MCP gateway with Intel ONNX Runtime
        if: matrix.target == 'x86_64-apple-darwin'
        env:
          ORT_LIB_LOCATION: ${{ github.workspace }}/target/release/lib
          ORT_PREFER_DYNAMIC_LINK: "1"
          RUSTFLAGS: "-C link-arg=-Wl,-rpath,@executable_path/lib"
        run: cargo build --release --locked -p adoc-cli -p adoc-mcp

      - name: Build CLI and MCP gateway
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo build --release --locked -p adoc-cli -p adoc-mcp

      - name: Identify the candidate version
        id: version
        run: echo "version=v$(./target/release/adoc --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Verify release tag matches the binary
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(./target/release/adoc --version | awk '{print $2}')"

      - name: Smoke-check binary against example project
        run: ./target/release/adoc check examples/expanded-pilot

      - name: Package tarball with checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ARCHIVE="adoc-${VERSION}-${{ matrix.target }}.tar.gz"
          if [ "${{ matrix.target }}" = x86_64-apple-darwin ]; then
            for binary in target/release/adoc target/release/adoc-mcp; do
              if ! otool -l "$binary" | grep -A2 LC_RPATH | grep -Fq 'path @executable_path/lib (offset'; then
                install_name_tool -add_rpath '@executable_path/lib' "$binary"
              fi
              otool -L "$binary"
              otool -l "$binary" | grep -A2 LC_RPATH | grep -Fq 'path @executable_path/lib (offset'
            done
            find -L target/release/lib -maxdepth 1 -name 'libonnxruntime*.dylib' -type f -print
            test -f target/release/lib/LICENSE
            test -f target/release/lib/ThirdPartyNotices.txt
            (cd target/release && shasum -a 256 lib/libonnxruntime*.dylib) > "$ARCHIVE.runtime.sha256"
            tar -czf "$ARCHIVE" -C target/release adoc adoc-mcp lib -C "$GITHUB_WORKSPACE" LICENSE
          else
            tar -czf "$ARCHIVE" -C target/release adoc adoc-mcp -C "$GITHUB_WORKSPACE" LICENSE
          fi
          case "${{ matrix.target }}" in
            x86_64-apple-darwin) EXPECTED_ARCH='Mach-O 64-bit executable x86_64' ;;
            aarch64-apple-darwin) EXPECTED_ARCH='Mach-O 64-bit executable arm64' ;;
            x86_64-unknown-linux-gnu) EXPECTED_ARCH='ELF 64-bit LSB.*x86-64' ;;
            aarch64-unknown-linux-gnu) EXPECTED_ARCH='ELF 64-bit LSB.*ARM aarch64' ;;
            *) exit 1 ;;
          esac
          for binary in target/release/adoc target/release/adoc-mcp; do
            file "$binary"
            file "$binary" | grep -Eq "$EXPECTED_ARCH"
          done
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          shasum -a 256 -c "$ARCHIVE.sha256"
          mkdir unpacked
          tar -xzf "$ARCHIVE" -C unpacked
          if [ "${{ matrix.target }}" = x86_64-apple-darwin ]; then
            find -L unpacked/lib -maxdepth 1 -name 'libonnxruntime*.dylib' -type f -print
            for binary in unpacked/adoc unpacked/adoc-mcp; do
              otool -L "$binary" | grep -Eq '@rpath/libonnxruntime.*\.dylib'
              otool -l "$binary" | grep -A2 LC_RPATH | grep -Fq 'path @executable_path/lib (offset'
            done
          fi

      - name: Verify the packaged first-use journey
        run: python3 scripts/smoke-test.py --bin-dir unpacked --embeddings

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: |
            adoc-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz
            adoc-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz.sha256
            adoc-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz.runtime.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    # PRs and manual runs validate packages without publishing a release.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload assets
      id-token: write # keyless Sigstore signing via OIDC
      attestations: write # record the provenance attestation
    steps:
      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      # Re-runnable. A run that created the release and then died — a flaky
      # asset upload, or the verify step below — must be recoverable, and a
      # bare `create` fails with "already exists" and leaves the tag needing a
      # release deleted by hand. Checking first restores that path without the
      # old `create || view` swallow, which hid every create failure and not
      # just the one it was written for. Both matrix legs used to race this
      # concurrently; publish is a single job now, so the check cannot lose.
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          # This job does no checkout, so gh has no remote to infer from.
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber dist/*
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
          fi

      # Prove the attestation is actually verifiable against the published
      # asset rather than trusting that the attest step emitted something.
      - name: Verify the published attestation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for archive in dist/*.tar.gz; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"
          done
