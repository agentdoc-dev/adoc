name: Bug report
description: Report a reproducible, non-sensitive problem in AgentDoc.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use the private reporting route in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the CLI version, or the source commit if running from a checkout.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands, input, and relevant configuration.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include complete errors or diagnostics.
    validations:
      required: true
